[project]
name = "agentic-ai-ollama"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
    "langchain-classic",
    "grandalf",
    "ipython",
    "requests",
    "truststore",
    "tavily-python",
    "sqlalchemy",
    "pandas",
    "elasticsearch",
    "mlflow",
    "langchain-chroma",
    "langchain-community",
    "pypdf",
    "fpdf2",
    "ragas",
    "datasets<5",          # datasets 5 needs a newer pyarrow than mlflow allows
    "pyarrow>=21,<23",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "langmem",
    "mcp<2",               # langchain-mcp-adapters needs mcp 1.x; mcp 2 renamed FastMCP
    "langchain-mcp-adapters",
]

[tool.setuptools]
py-modules = ["config"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
