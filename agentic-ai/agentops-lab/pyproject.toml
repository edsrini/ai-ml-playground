[project]
name = "agentops-lab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
    "langchain-classic",
    "grandalf",
    "ipython",
]

[tool.setuptools]
py-modules = ["config"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
