name: tests

# Runs the deterministic tool tests for the agent projects.
# They use stub clients and fake embeddings, so no Ollama, Elasticsearch or API keys are needed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - agentic-ai/text2sql-agent
          - agentic-ai/ai-knowledgebase-agent
          - agentic-ai/log-search-lab
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
